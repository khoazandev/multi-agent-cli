[package]
name = "multi-agent-cli-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.16.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
